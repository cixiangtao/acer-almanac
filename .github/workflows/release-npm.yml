name: Release npm package

on:
  push:
    branches:
      - master
    paths:
      - packages/core/package.json
      - pnpm-lock.yaml
      - CHANGELOG.md

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  gate:
    name: Verify merged npm release PR
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Verify release admission
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          echo "release=false" >> "$GITHUB_OUTPUT"

          pull_requests="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/pulls")"
          release_pr="$(jq -c '
            [
              .[]
              | select(.merged_at != null)
              | select(.base.ref == "master")
              | select(.head.repo.full_name == env.GITHUB_REPOSITORY)
              | select(.head.ref | startswith("release/npm-v"))
            ]
            | if length == 1 then .[0] else empty end
          ' <<< "$pull_requests")"

          if [[ -z "$release_pr" ]]; then
            echo "This commit is not the merge of one npm release PR; publication is skipped."
            exit 0
          fi

          pr_number="$(jq -r '.number' <<< "$release_pr")"
          head_ref="$(jq -r '.head.ref' <<< "$release_pr")"
          base_sha="$(jq -r '.base.sha' <<< "$release_pr")"
          version="$(node -p 'require("./packages/core/package.json").version')"
          tag="v${version}"

          if [[ "$head_ref" != "release/npm-${tag}" ]]; then
            echo "Release branch ${head_ref} must be release/npm-${tag}." >&2
            exit 1
          fi

          changed_files="$(gh api \
            -H "Accept: application/vnd.github+json" \
            --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/files" \
            --jq '.[].filename')"
          while IFS= read -r file; do
            case "$file" in
              packages/core/package.json|pnpm-lock.yaml|CHANGELOG.md) ;;
              *)
                echo "npm release PR #${pr_number} contains non-release file: ${file}" >&2
                exit 1
                ;;
            esac
          done <<< "$changed_files"

          git show "${base_sha}:packages/core/package.json" > "$RUNNER_TEMP/package.base.json"
          jq -S 'del(.version)' "$RUNNER_TEMP/package.base.json" \
            > "$RUNNER_TEMP/package.base.normalized.json"
          jq -S 'del(.version)' packages/core/package.json \
            > "$RUNNER_TEMP/package.release.normalized.json"
          cmp \
            "$RUNNER_TEMP/package.base.normalized.json" \
            "$RUNNER_TEMP/package.release.normalized.json"

          git fetch --force --tags origin
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
              echo "Tag ${tag} already points to ${tag_sha}, not ${RELEASE_SHA}." >&2
              exit 1
            fi
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and pack npm artifact
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and pack
        run: |
          pnpm run release:check
          mkdir -p artifacts
          (
            cd packages/core
            npm pack --pack-destination ../../artifacts
          )

      - name: Upload npm artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acer-almanac-npm-${{ needs.gate.outputs.version }}
          path: artifacts/*.tgz
          if-no-files-found: error

  publish:
    name: Tag and publish npm package
    needs:
      - gate
      - build
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download npm artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: acer-almanac-npm-${{ needs.gate.outputs.version }}
          path: artifacts

      - name: Create release tag
        env:
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          git fetch --force --tags origin
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release ${TAG}" "$GITHUB_SHA"
          git push origin "refs/tags/${TAG}"

      - name: Publish with npm trusted publishing
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          if npm view "acer-almanac@${VERSION}" version >/dev/null 2>&1; then
            echo "acer-almanac@${VERSION} is already published; skipping npm publish."
          else
            npm publish artifacts/*.tgz --access public --provenance
          fi

      - name: Verify npm publication
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: test "$(npm view acer-almanac@"$VERSION" version)" = "$VERSION"
