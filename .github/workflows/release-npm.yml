name: Release npm package

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_pr:
        description: Merged Release Please PR number to resume
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  gate:
    name: Verify merged npm release PR
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      pr-number: ${{ steps.release.outputs.pr-number }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify release admission
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_PR: ${{ inputs.release_pr || '' }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          echo "release=false" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$RECOVERY_PR" =~ ^[1-9][0-9]*$ ]]; then
              echo "A numeric merged release PR is required for recovery." >&2
              exit 1
            fi
            pull_requests="$(gh api -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/pulls/${RECOVERY_PR}" | jq -c '[.]')"
            RELEASE_SHA="$(jq -r '.[0].merge_commit_sha // empty' <<< "$pull_requests")"
            if [[ -z "$RELEASE_SHA" ]]; then
              echo "Release PR #${RECOVERY_PR} is not merged." >&2
              exit 1
            fi
          else
            pull_requests="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/pulls")"
          fi
          export RELEASE_SHA
          release_pr="$(jq -c '
            [
              .[]
              | select(.merged_at != null)
              | select(.merge_commit_sha == env.RELEASE_SHA)
              | select(.base.ref == "master")
              | select(.head.repo.full_name == env.GITHUB_REPOSITORY)
              | select(.head.ref | startswith("release-please--branches--master--"))
              | select([.labels[].name] | any(. == "autorelease: pending" or . == "autorelease: tagged"))
            ]
            | if length == 1 then .[0] else empty end
          ' <<< "$pull_requests")"

          if [[ -z "$release_pr" ]]; then
            echo "This commit is not the merge of one automated release PR; publication is skipped."
            exit 0
          fi

          pr_number="$(jq -r '.number' <<< "$release_pr")"
          base_sha="$(jq -r '.base.sha' <<< "$release_pr")"
          base_branch="$(jq -r '.base.ref' <<< "$release_pr")"
          git fetch --force origin "$base_branch" --tags
          git merge-base --is-ancestor "$RELEASE_SHA" "origin/${base_branch}"
          git checkout --detach "$RELEASE_SHA"
          version="$(node -p 'require("./packages/core/package.json").version')"
          tag="v${version}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable release version: ${version}" >&2
            exit 1
          fi

          changed_files="$(gh api \
            -H "Accept: application/vnd.github+json" \
            --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/files" \
            --jq '.[].filename')"
          while IFS= read -r file; do
            case "$file" in
              .release-please-manifest.json|package.json|packages/core/package.json|CHANGELOG.md) ;;
              *)
                echo "npm release PR #${pr_number} contains non-release file: ${file}" >&2
                exit 1
                ;;
            esac
          done <<< "$changed_files"

          git show "${base_sha}:packages/core/package.json" > "$RUNNER_TEMP/package.base.json"
          jq -S 'del(.version)' "$RUNNER_TEMP/package.base.json" \
            > "$RUNNER_TEMP/package.base.normalized.json"
          jq -S 'del(.version)' packages/core/package.json \
            > "$RUNNER_TEMP/package.release.normalized.json"
          cmp \
            "$RUNNER_TEMP/package.base.normalized.json" \
            "$RUNNER_TEMP/package.release.normalized.json"
          git show "${base_sha}:package.json" > "$RUNNER_TEMP/workspace.base.json"
          jq -S 'del(.version)' "$RUNNER_TEMP/workspace.base.json" > "$RUNNER_TEMP/workspace.base.normalized.json"
          jq -S 'del(.version)' package.json > "$RUNNER_TEMP/workspace.release.normalized.json"
          cmp "$RUNNER_TEMP/workspace.base.normalized.json" "$RUNNER_TEMP/workspace.release.normalized.json"
          test "$(node -p 'require("./package.json").version')" = "$version"
          test "$(jq -r '.["."]' .release-please-manifest.json)" = "$version"
          grep -F "$version" CHANGELOG.md >/dev/null

          git fetch --force --tags origin
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
              echo "Tag ${tag} already points to ${tag_sha}, not ${RELEASE_SHA}." >&2
              exit 1
            fi
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "pr-number=${pr_number}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and pack npm artifact
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and pack
        run: |
          pnpm run release:check
          mkdir -p artifacts
          (
            cd packages/core
            npm pack --pack-destination ../../artifacts
          )

      - name: Upload npm artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acer-almanac-npm-${{ needs.gate.outputs.version }}
          path: artifacts/*.tgz
          if-no-files-found: error

  publish:
    name: Tag and publish npm package
    needs:
      - gate
      - build
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download npm artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: acer-almanac-npm-${{ needs.gate.outputs.version }}
          path: artifacts

      - name: Create release tag
        env:
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          git fetch --force --tags origin
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            test "$(git rev-list -n 1 "$TAG")" = "$RELEASE_SHA"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release ${TAG}" "$RELEASE_SHA"
          git push origin "refs/tags/${TAG}"

      - name: Publish with npm trusted publishing
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          if npm view "acer-almanac@${VERSION}" version >/dev/null 2>&1; then
            echo "acer-almanac@${VERSION} is already published; skipping npm publish."
          else
            npm publish ./artifacts/*.tgz --access public --provenance
          fi

      - name: Create or repair GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --latest
          fi

      - name: Verify publication
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          test "$(npm view acer-almanac@"$VERSION" version)" = "$VERSION"
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,url

      - name: Mark release PR complete
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.gate.outputs.pr-number }}
        run: |
          if gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' | grep -Fxq "autorelease: pending"; then
            gh pr edit "$PR_NUMBER" --remove-label "autorelease: pending"
          fi

  release-pr:
    name: Maintain automated release PR
    needs: [gate, publish]
    if: >-
      always() &&
      needs.gate.result == 'success' &&
      (needs.gate.outputs.release != 'true' || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify release controller credentials
        env:
          CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          test -n "$CLIENT_ID" || { echo "RELEASE_APP_CLIENT_ID is not configured." >&2; exit 1; }
          test -n "$PRIVATE_KEY" || { echo "RELEASE_APP_PRIVATE_KEY is not configured." >&2; exit 1; }
      - name: Create short-lived release controller token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Create or update release PR
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.release-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
