name: Publish Chrome Extension

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: chrome-web-store
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify release source
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "Chrome Web Store releases must run from master."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

      - name: Test
        run: pnpm run test

      - name: Build extension
        run: pnpm run build:extension

      - name: Package extension
        run: pnpm run package:extension -- --output artifacts/acer-almanac-chrome.zip

      - name: Publish changed version
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: >
          pnpm run cws:publish --
          --package artifacts/acer-almanac-chrome.zip
          --json
