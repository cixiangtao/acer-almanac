name: Publish Chrome Extension

on:
  push:
    branches:
      - master
    paths:
      - apps/chrome-extension/package.json
      - apps/chrome-extension/public/manifest.json
      - CHANGELOG.md

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  gate:
    name: Verify merged Chrome release PR
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Verify release admission
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          echo "release=false" >> "$GITHUB_OUTPUT"

          pull_requests="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/pulls")"
          release_pr="$(jq -c '
            [
              .[]
              | select(.merged_at != null)
              | select(.base.ref == "master")
              | select(.head.repo.full_name == env.GITHUB_REPOSITORY)
              | select(.head.ref | startswith("release/chrome-v"))
            ]
            | if length == 1 then .[0] else empty end
          ' <<< "$pull_requests")"

          if [[ -z "$release_pr" ]]; then
            echo "This commit is not the merge of one Chrome release PR; publication is skipped."
            exit 0
          fi

          pr_number="$(jq -r '.number' <<< "$release_pr")"
          head_ref="$(jq -r '.head.ref' <<< "$release_pr")"
          base_sha="$(jq -r '.base.sha' <<< "$release_pr")"
          package_version="$(jq -r '.version' apps/chrome-extension/package.json)"
          manifest_version="$(jq -r '.version' apps/chrome-extension/public/manifest.json)"

          if [[ "$package_version" != "$manifest_version" ]]; then
            echo "Chrome package and manifest versions must match." >&2
            exit 1
          fi
          if [[ "$head_ref" != "release/chrome-v${manifest_version}" ]]; then
            echo "Release branch ${head_ref} must be release/chrome-v${manifest_version}." >&2
            exit 1
          fi

          changed_files="$(gh api \
            -H "Accept: application/vnd.github+json" \
            --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/files" \
            --jq '.[].filename')"
          while IFS= read -r file; do
            case "$file" in
              apps/chrome-extension/package.json|apps/chrome-extension/public/manifest.json|CHANGELOG.md) ;;
              *)
                echo "Chrome release PR #${pr_number} contains non-release file: ${file}" >&2
                exit 1
                ;;
            esac
          done <<< "$changed_files"

          git show "${base_sha}:apps/chrome-extension/package.json" \
            > "$RUNNER_TEMP/chrome-package.base.json"
          jq -S 'del(.version)' "$RUNNER_TEMP/chrome-package.base.json" \
            > "$RUNNER_TEMP/chrome-package.base.normalized.json"
          jq -S 'del(.version)' apps/chrome-extension/package.json \
            > "$RUNNER_TEMP/chrome-package.release.normalized.json"
          cmp \
            "$RUNNER_TEMP/chrome-package.base.normalized.json" \
            "$RUNNER_TEMP/chrome-package.release.normalized.json"

          git show "${base_sha}:apps/chrome-extension/public/manifest.json" \
            > "$RUNNER_TEMP/manifest.base.json"
          jq -S 'del(.version)' "$RUNNER_TEMP/manifest.base.json" \
            > "$RUNNER_TEMP/manifest.base.normalized.json"
          jq -S 'del(.version)' apps/chrome-extension/public/manifest.json \
            > "$RUNNER_TEMP/manifest.release.normalized.json"
          cmp \
            "$RUNNER_TEMP/manifest.base.normalized.json" \
            "$RUNNER_TEMP/manifest.release.normalized.json"

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=${manifest_version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and verify extension package
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate workspace
        run: |
          pnpm run check
          pnpm run test

      - name: Build and package extension
        run: |
          pnpm run build:extension
          pnpm run package:extension -- --output artifacts/acer-almanac-chrome.zip

      - name: Upload verified extension
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acer-almanac-chrome-${{ needs.gate.outputs.version }}
          path: artifacts/acer-almanac-chrome.zip
          if-no-files-found: error

  publish:
    name: Submit to Chrome Web Store
    needs:
      - gate
      - build
    if: needs.gate.outputs.release == 'true'
    environment:
      name: chrome-web-store
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified extension
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: acer-almanac-chrome-${{ needs.gate.outputs.version }}
          path: artifacts

      - name: Publish changed version
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: >
          pnpm run cws:publish --
          --package artifacts/acer-almanac-chrome.zip
          --json
