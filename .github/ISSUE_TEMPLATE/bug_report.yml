name: Bug 报告
description: 报告 npm 包、Pages 预览或 Chrome 扩展中可复现的问题。
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全漏洞请使用私密安全报告，不要在这里公开披露。
  - type: dropdown
    id: product
    attributes:
      label: 受影响的产品
      options:
        - npm 核心包
        - GitHub Pages 预览
        - Chrome 扩展
        - 开发或发布工具
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: npm/扩展版本，或相关 commit。
      placeholder: 1.0.2
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
      description: 请提供可以稳定复现问题的最少步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: Node.js、浏览器、操作系统及其他相关版本。
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，且没有提交凭据或个人数据。
          required: true
